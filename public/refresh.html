<!doctype html><html lang="my"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TMF Free — Update</title><style>body{font:16px/1.8 system-ui;max-width:600px;margin:70px auto;padding:24px;color:#173f35;background:#f8f7f2}button,a{display:inline-block;padding:14px 22px;border:0;border-radius:8px;background:#173f35;color:white;text-decoration:none;font:inherit}p{margin:24px 0}</style><h1>TMF Free v5.2</h1><p>ဒီဇိုင်းအဟောင်း ပြနေသေးရင် အောက်ပါခလုတ်ကို နှိပ်ပါ။ TMF ရဲ့ cache အဟောင်းကို ရှင်းပြီး version အသစ် ဖွင့်ပေးပါမယ်။</p><button id="update">Version အသစ် ဖွင့်ရန်</button><p id="status" role="status"></p><a href="./?v=free52">ဝဘ်ဆိုက်သို့</a><script>document.getElementById('update').onclick=async()=>{const b=document.getElementById('update');b.disabled=true;try{if('caches'in window)await Promise.all((await caches.keys()).filter(k=>k.startsWith('tmf-')).map(k=>caches.delete(k)));if('serviceWorker'in navigator){const scope=new URL('./',location.href).href;for(const r of await navigator.serviceWorker.getRegistrations())if(r.scope===scope)await r.unregister();}location.replace('./?v=free52');}catch{document.getElementById('status').textContent='Browser settings မှ site data ကိုရှင်းပြီး ဝဘ်ဆိုက်ကို ပြန်ဖွင့်ပါ။';b.disabled=false;}};</script></html>
